name: Build NXERP Helpdesk Image
on:
  workflow_dispatch:
  push:
    branches:
      - nxerp-stable

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names on ghcr.io must be lowercase; the repo name isn't.
      # Helpdesk is built from this branch of this repo, so the image always matches the pushed code.
      - name: Set image name and apps
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "FRAPPE_BRANCH=version-15" >> $GITHUB_ENV
          echo "[{\"url\": \"https://github.com/frappe/telephony\", \"branch\": \"develop\"}, {\"url\": \"https://github.com/${GITHUB_REPOSITORY}\", \"branch\": \"${GITHUB_REF_NAME}\"}]" > apps.json
          cat apps.json

      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Build
        uses: docker/build-push-action@v6
        with:
          load: true
          context: builds
          file: builds/images/layered/Containerfile
          tags: >
            ${{ env.IMAGE }}:nxerp-${{ env.SHORT_SHA }},
            ${{ env.IMAGE }}:nxerp-stable
          build-args: |
            "FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}"
          secret-files: |
            apps_json=apps.json

      - name: Verify apps are installed
        run: |
          apps=$(docker run --rm --entrypoint ls "$IMAGE:nxerp-stable" apps)
          echo "$apps"
          grep -qx helpdesk <<< "$apps" && grep -qx telephony <<< "$apps"

      - name: Push
        run: docker push --all-tags "$IMAGE"

      - name: Summary
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`$IMAGE:nxerp-$SHORT_SHA\` (pin this on the server)" >> $GITHUB_STEP_SUMMARY
          echo "- \`$IMAGE:nxerp-stable\` (latest build of this branch)" >> $GITHUB_STEP_SUMMARY
